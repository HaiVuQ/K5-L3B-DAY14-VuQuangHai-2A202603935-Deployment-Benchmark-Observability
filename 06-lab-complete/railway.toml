# Railway config-as-code — https://docs.railway.com/reference/config-as-code
# Secret (AGENT_API_KEY) và REDIS_URL đặt trên Railway dashboard / CLI, không ghi ở đây:
#   railway variables --set AGENT_API_KEY=<key>
#   REDIS_URL=${{Redis.REDIS_URL}}   (reference tới service Redis trong cùng project)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand: dùng CMD trong Dockerfile (nghe theo $PORT Railway cấp)
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
