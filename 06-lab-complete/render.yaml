# Render Blueprint — https://render.com/docs/blueprint-spec
# Render → New → Blueprint → chọn repo. Vì file này nằm trong thư mục con,
# đặt "Blueprint file path" = 06-lab-complete/render.yaml
services:
  - type: web
    name: day14-production-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: AGENT_API_KEY
        sync: false            # nhập thủ công trên dashboard, không commit giá trị
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-agent-redis
          property: connectionString

  - type: keyvalue
    name: day14-agent-redis
    plan: free
    region: singapore
    ipAllowList: []            # chỉ cho phép kết nối nội bộ từ service trong Render
    maxmemoryPolicy: noeviction
